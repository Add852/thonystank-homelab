site:
  name: "Thony Stank Homelab"

# ── Device-specific values ──────────────────────────────────────────────
# These reference .env (gitignored) so this file stays portable across
# machines. Copy .env.example to .env and adjust per device.
resume_path: ${RESUME_PATH}

profile:
  github:
    username: "Add852"
    cache_ttl_minutes: 15              # GitHub API cache (60 req/h unauthenticated)
    hide_repos:                        # repos to exclude from /about (name or full URL)
      # - https://github.com/Add852/thonystank-homelab
      - https://github.com/Add852/add852.github.io
      - https://github.com/Add852/nixos-config
      - https://github.com/Add852/xpense-tracker
      - https://github.com/Add852/WebServer

  linkedin: "https://www.linkedin.com/in/anthony-dayrit-785284371"
  messenger: "https://m.me/xusernametakenx/"
  phone: "+63 908 485 3181"
  email: "xadd852x@gmail.com"

markdown:
  notes_dir: ${NOTES_DIR}              # absolute path to the notes folder
  contents_dir: ${CONTENTS_DIR}        # absolute path to the reviews folder
  attachments_dir: ${ATTACHMENTS_DIR}  # absolute path to embedded ![[...]] files
  public_tag: "public"                 # notes with this tag are listed
  private_tag: "private"               # also viewable, but not listed

services:
  Immich:
    port: 2283
    url: http://192.168.1.17:2283
    public_url: https://photos.thonystank.dpdns.org
    icon: fa-images
    icon_url: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/immich.svg
    description: Self-hosted photo and video backup — Google Photos alternative
  Proxmox:
    port: 8006
    host: 192.168.1.16
    url: https://192.168.1.16:8006
    icon: fa-server
    icon_url: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/proxmox.svg
    description: Homelab hypervisor — hosts Ubuntu Server VM, Tailscale VPN, and all services on an old laptop

terminal:
  user: "tony" # prompt + fastfetch header
  host: "homelab"
  cow_message: "Hello, mortals!" # cowsay command + speech bubble on home
  shell: "fish" # terminal title bar
  type_duration_ms: 1500 # seconds a typed command takes, regardless of length
