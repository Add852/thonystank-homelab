<script>
/* ── Mobile menu toggle ── */
function toggleMobileMenu() {
    const menu = document.getElementById('mobileMenu');
    if (!menu) return;
    menu.classList.toggle('hidden');
    const bars = document.getElementById('menuBars');
    const xmark = document.getElementById('menuXmark');
    if (bars) bars.classList.toggle('hidden');
    if (xmark) xmark.classList.toggle('hidden');
}

/* close mobile menu on click outside */
document.addEventListener('click', function(e) {
    const menu = document.getElementById('mobileMenu');
    const btn = e.target.closest('button');
    if (!menu || menu.classList.contains('hidden')) return;
    if (btn && btn.getAttribute('onclick')?.includes('toggleMobileMenu')) return;
    if (!e.target.closest('#mobileMenu')) {
        menu.classList.add('hidden');
        const bars = document.getElementById('menuBars');
        const xmark = document.getElementById('menuXmark');
        if (bars) bars.classList.remove('hidden');
        if (xmark) xmark.classList.add('hidden');
    }
});

/* ── fastfetch panel + terminal helpers (shared: home terminal + about profile) ── */
window.ff = (function() {
    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
    }
    function link(href, text) {
        var a = el('a', 'ff-link', text);
        a.href = href;
        if (href.indexOf('http') === 0 || href.indexOf('mailto:') === 0) a.target = '_blank';
        a.appendChild(el('span', 'ff-ext', '\uf08e'));  // "opens elsewhere" indicator
        return a;
    }
    function row(key, val) {
        var r = el('div', 'ff-row');
        r.appendChild(el('span', 'ff-key', key));
        var v = el('span', 'ff-val');
        if (val instanceof Node) v.appendChild(val); else v.textContent = val;
        r.appendChild(v);
        return r;
    }
    function cmdLine(body, user, host) {
        var line = el('div', 'term-cmd');
        line.appendChild(el('span', 'term-prompt-ic', '\uf31a '));
        line.appendChild(el('span', 'term-prompt-user', user));
        line.appendChild(el('span', 'term-prompt-at', '@'));
        line.appendChild(el('span', 'term-prompt-host', host));
        line.appendChild(el('span', 'term-prompt-ic', ' \uf07b '));
        line.appendChild(el('span', 'term-prompt-path', '~ '));
        line.appendChild(el('span', 'term-arrow', '\ue0b0 '));
        var txt = el('span', 'term-typed');
        line.appendChild(txt);
        var cur = el('span', 'term-cursor');
        line.appendChild(cur);
        body.appendChild(line);
        return { txt: txt, cur: cur };
    }
    function typeText(span, text, durationMs) {
        return new Promise(function(resolve) {
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                span.textContent = text; resolve(); return;
            }
            // Constant total duration regardless of text length
            var delay = Math.max(8, (durationMs || 2000) / Math.max(text.length, 1));
            var i = 0;
            (function tick() {
                if (i >= text.length) { resolve(); return; }
                span.textContent += text.charAt(i++);
                setTimeout(tick, delay);
            })();
        });
    }
    function build(profile, opts) {
        opts = opts || {};
        profile = profile || {};
        var panel = el('div', 'ff-panel');
        var logoWrap = el('div', 'ff-logo-wrap');
        if (profile.avatar_url) {
            var img = el('img', 'ff-logo');
            img.src = profile.avatar_url;
            img.alt = (profile.login || 'avatar') + ' avatar';
            logoWrap.appendChild(img);
        } else {
            logoWrap.appendChild(el('pre', '', '  ___\n [o_o]\n /|_|\\\n  d b'));
        }
        panel.appendChild(logoWrap);

        var info = el('div', 'ff-info');
        info.appendChild(el('div', 'ff-title', (opts.user || 'user') + '@' + (opts.host || 'localhost')));
        info.appendChild(el('div', 'ff-sep', '-----------------'));
        if (profile.name) info.appendChild(row('\uf007 Name', profile.name));
        if (profile.bio) info.appendChild(row('\uf02d Bio', profile.bio));
        if (profile.location) info.appendChild(row('\uf041 Location', profile.location));
        if (profile.login) {
            info.appendChild(row('\uf09b GitHub', link('https://github.com/' + profile.login,
                '@' + profile.login + ' \u00b7 ' + (profile.followers || 0) + ' followers')));
        }
        var c = opts.contact || {};
        if (c.linkedin) info.appendChild(row('\uf0e1 LinkedIn', link(c.linkedin, c.linkedin.replace(/https?:\/\/(www\.)?/, ''))));
        if (c.messenger) info.appendChild(row('\uf086 Message', link(c.messenger, 'Messenger')));
        if (c.phone) info.appendChild(row('\uf095 Phone', link('tel:' + c.phone.replace(/\s/g, ''), c.phone)));
        if (c.email) info.appendChild(row('\uf0e0 Email', link('mailto:' + c.email, c.email)));
        panel.appendChild(info);
        return panel;
    }
    return { build: build, cmdLine: cmdLine, typeText: typeText, el: el };
})();

/* PWA Service Worker */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => console.log('SW registered:', reg.scope))
            .catch((err) => console.warn('SW registration failed:', err));
    });
}


/* ── Skeleton map: path prefix → skeleton page key ── */
const SKELETON_KEYS = {
    '/': '',
    '/about': 'about',
    '/notes': 'notes',
    '/reviews': 'reviews',
    '/note': 'note',
};

/* ── Preload skeletons into hidden <template> tags on page load ── */
(function() {
    const seen = {};
    const paths = Object.keys(SKELETON_KEYS);
    const fragments = document.createDocumentFragment();

    paths.forEach(function(path) {
        const key = SKELETON_KEYS[path];
        if (!key && key !== '') return;
        if (seen[key]) return;
        seen[key] = true;

        const el = document.createElement('template');
        el.id = 'skeleton-' + (key || 'home');
        fragments.appendChild(el);
    });
    document.body.appendChild(fragments);

    // Fetch skeletons in parallel
    var uniqueKeys = Object.keys(seen);
    uniqueKeys.forEach(function(key) {
        var url;
        if (key === '') {
            url = '/api/skeleton/__root__';
        } else if (key === 'note') {
            url = '/api/skeleton/notes';
        } else {
            url = '/api/skeleton/' + key;
        }

        fetch(url).then(function(r) { return r.text(); }).then(function(html) {
            var targetId;
            if (key === 'note') targetId = 'skeleton-notes';
            else targetId = 'skeleton-' + (key || 'home');
            var tmpl = document.getElementById(targetId);
            if (tmpl) {
                tmpl.innerHTML = html;
            }
        }).catch(function() {});
    });
})();


/* ── Turbo-style navigation with skeleton preload ── */
(function() {
    function isInternal(href) {
        try {
            var u = new URL(href, location.origin);
            return u.origin === location.origin && !href.startsWith('#') && !href.includes('/static/attachments/');
        } catch(e) { return false; }
    }

    function updateNav(path) {
        var links = document.querySelectorAll('#desktop-nav .nav-link, #mobileMenu .nav-link-mobile');
        links.forEach(function(link) {
            var href = link.getAttribute('href');
            if (!href) return;
            var active = href === path ||
                (path.startsWith('/note') && href === '/notes') ||
                (path.startsWith('/reviews') && href === '/reviews');
            link.classList.toggle('nav-active', active);
        });
    }

    function getSkeletonKey(path) {
        // Exact match
        if (SKELETON_KEYS[path] !== undefined) return SKELETON_KEYS[path];
        // Prefix match for /note/...
        if (path.startsWith('/note')) return 'note';
        return null;
    }

    async function navigateTo(url, pushState) {
        var main = document.querySelector('main');
        if (!main) { location.href = url; return; }

        // Close mobile menu if open
        var mobileMenu = document.getElementById('mobileMenu');
        if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
            mobileMenu.classList.add('hidden');
            var bars = document.getElementById('menuBars');
            var xmark = document.getElementById('menuXmark');
            if (bars) bars.classList.remove('hidden');
            if (xmark) xmark.classList.add('hidden');
        }

        var path = new URL(url, location.origin).pathname;
        updateNav(path);
        document.title = '...';

        // ── Phase 1: show skeleton instantly ──
        var skKey = getSkeletonKey(path);
        var templateId = 'skeleton-' + (skKey || 'home');
        if (skKey === '') templateId = 'skeleton-home';
        var tmpl = document.getElementById(templateId);

        if (tmpl && tmpl.innerHTML) {
            var clone = document.importNode(tmpl.content, true);
            main.innerHTML = '';
            main.appendChild(clone);
            main.style.opacity = '0.7';
        } else {
            main.style.opacity = '0.4';
        }
        main.style.transition = 'opacity 80ms';

        try {
            document.querySelectorAll('[data-turbo]').forEach(function(el) { el.remove(); });

            // ── Phase 2: fetch real page ──
            var resp = await fetch(url);
            if (!resp.ok || resp.redirected) throw new Error('redirect');
            var html = await resp.text();
            var doc = new DOMParser().parseFromString(html, 'text/html');

            var newMain = doc.querySelector('main');
            if (!newMain) throw new Error('no main');

            // Swap real content (smooth — skeleton was already showing)
            main.innerHTML = newMain.innerHTML;

            // Inject page-specific stylesheets
            doc.querySelectorAll('head link[rel="stylesheet"], head style').forEach(function(el) {
                var href = el.getAttribute('href') || '';
                var id = 'turbo-style-' + href.replace(/[^a-z0-9]/gi, '-');
                if (!document.getElementById(id)) {
                    var clone = el.cloneNode(true);
                    clone.id = id;
                    clone.setAttribute('data-turbo', 'true');
                    document.head.appendChild(clone);
                }
            });

            // Execute new scripts
            main.querySelectorAll('script').forEach(function(oldScript) {
                var newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(function(attr) {
                    newScript.setAttribute(attr.name, attr.value);
                });
                newScript.textContent = oldScript.textContent;
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });

            main.style.opacity = '1';

            if (window.tailwind && window.tailwind.refresh) {
                window.tailwind.refresh();
            }

            var newTitle = doc.querySelector('title');
            if (newTitle) document.title = newTitle.textContent;

            if (pushState !== false) {
                history.pushState({url: url}, '', url);
            }
        } catch(e) {
            location.href = url;
        }
    }

    document.addEventListener('click', function(e) {
        var link = e.target.closest('a');
        if (!link) return;
        if (link.getAttribute('target') === '_blank') return;  // let the browser open a new tab
        var href = link.getAttribute('href');
        if (!href || !isInternal(href)) return;
        if (e.ctrlKey || e.metaKey || e.shiftKey || e.which === 2) return;
        e.preventDefault();
        navigateTo(href);
    });

    window.addEventListener('popstate', function(e) {
        if (e.state && e.state.url) {
            navigateTo(e.state.url, false);
        }
    });

    updateNav(location.pathname);
})();
</script>
