<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Thony Stank Homelab{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Thony Stank Homelab — personal dashboard, notes, and reviews by Ant.{% endblock %}">
    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ThonyStank">
    <link rel="manifest" href="/manifest.json">
    <meta property="og:title" content="{% block og_title %}Thony Stank Homelab{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Thony Stank Homelab — personal dashboard, notes, and reviews by Ant.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:image" content="{% block og_image %}/static/favicon.svg{% endblock %}">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/global.css?v=4">
    {% block head_extra %}{% endblock %}
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
    {% include "partials/nav.html" %}
    <main class="max-w-6xl mx-auto px-4 py-4 sm:py-6">
        {% block content %}{% endblock %}
    </main>
    {% include "partials/scripts.html" %}
</body>
</html>
