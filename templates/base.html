<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Thony Stank Homelab{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .nav-link { min-height: 44px; display: inline-flex; align-items: center; padding-left: 12px; padding-right: 12px; }
        .nav-link-mobile { min-height: 44px; display: flex; align-items: center; }
        @media (max-width: 767px) {
            .nav-links-mobile {
                position: fixed; top: 56px; right: 8px; width: 200px;
                background: #1e293b; border: 1px solid #334155;
                border-radius: 12px; padding: 4px; z-index: 100;
                box-shadow: 0 10px 25px rgba(0,0,0,.5);
            }
        }
        .prose h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .prose h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
        .prose p  { margin-bottom: 0.75rem; line-height: 1.7; }
        .prose ul { list-style: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .prose img { max-width: 100%; height: auto; border-radius: 8px; }
        .modal-close { min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
    {% include "partials/nav.html" %}
    <main class="max-w-6xl mx-auto px-4 py-4 sm:py-6">
        {% block content %}{% endblock %}
    </main>
    {% include "partials/scripts.html" %}
</body>
</html>
